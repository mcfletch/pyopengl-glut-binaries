name: Windows ARM64 source wheel
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build from verified public source
        run: |
          python -m pip install build cmake ninja
          python tools/build_arm64.py --work "${{ runner.temp }}/native-arm64"
          python -m build --wheel -C--build-option=--plat-name=win_arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win-arm64
          path: dist/*-win_arm64.whl
          if-no-files-found: error

  # The same interpreter floor and ceiling as test.yml, except that native
  # Windows ARM64 CPython starts at 3.11.
  arm64-smoke:
    name: ARM64 wheel · ${{ matrix.python-version }}
    needs: arm64
    runs-on: windows-11-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - uses: actions/download-artifact@v4
        with:
          name: wheel-win-arm64
          path: dist
      - name: Install and exercise the wheel outside the checkout
        shell: pwsh
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          $python = "${{ runner.temp }}/wheel-smoke/Scripts/python.exe"
          $wheel = Get-ChildItem dist/*-win_arm64.whl
          if ($wheel.Count -ne 1) { throw 'Expected exactly one ARM64 wheel' }
          & $python -m pip install --no-index $wheel.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item tests/smoke_arm64.py "${{ runner.temp }}/smoke_arm64.py"
          Set-Location "${{ runner.temp }}"
          & $python -I smoke_arm64.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

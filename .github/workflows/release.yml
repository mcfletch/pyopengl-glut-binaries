name: release

# Every push to main runs the tests; if they are green *and* the version in
# src/pyopengl_glut_binaries/__init__.py is not already on PyPI, the wheels and
# an sdist are built and published there by trusted publishing.
#
# So a push that does not bump the version is an ordinary CI run, and bumping
# the version is what cuts a release. Nothing is ever published from a red
# build: PyPI versions are immutable, and a release number burned on a broken
# build cannot be taken back.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The same jobs a pull request runs. Called rather than duplicated, so the
  # gate cannot drift from the checks.
  tests:
    uses: ./.github/workflows/test.yml

  version:
    name: version
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: check
        name: Is this version already on PyPI?
        run: |
          VERSION=$(python - <<'EOF'
          import pathlib, re, sys
          text = pathlib.Path(
              'src/pyopengl_glut_binaries/__init__.py'
          ).read_text(encoding='utf-8')
          found = re.search(r'''^__version__\s*=\s*['"]([^'"]+)['"]''', text, re.M)
          if not found:
              sys.exit('no __version__ in src/pyopengl_glut_binaries/__init__.py')
          print(found.group(1))
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Only 200 and 404 are answers. Anything else -- a 5xx, a timeout, a
          # DNS failure -- means PyPI did not tell us, and guessing "not
          # published" would turn an outage into a failed upload against an
          # immutable version. Fail loudly instead and let a re-run settle it.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
                 "https://pypi.org/pypi/PyOpenGL-glut-binaries/$VERSION/json" || echo 000)
          case "$CODE" in
            200)
              echo "PyOpenGL-glut-binaries $VERSION is already on PyPI; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "PyOpenGL-glut-binaries $VERSION is not on PyPI; it will be published."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "PyPI answered HTTP $CODE for $VERSION; refusing to guess."
              exit 1
              ;;
          esac

  # ARM64 is built and smoke-tested in tests/arm64 and its wheel-win-arm64
  # artifact is collected by publish alongside these legacy wheels.
  # One Linux runner packages the x86/x64 Windows wheels. Nothing here is compiled --
  # the DLLs are prebuilt data and the tag comes from `--plat-name` rather than
  # from the machine -- so a Windows runner would build the same bytes more
  # slowly. cibuildwheel is for the same reason not used: it exists to compile
  # a matrix of interpreters, and this wheel serves every Python 3 at once.
  wheels:
    name: wheels
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the win32 and win_amd64 wheels
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel -C--build-option=--plat-name=win32
          python -m build --wheel -C--build-option=--plat-name=win_amd64

      # A wheel tagged `any` is the state this distribution exists to leave:
      # every platform downloading Windows binaries it cannot load. It is also
      # what the build silently produces if setup.py's tagging ever stops
      # taking effect, so it is checked rather than assumed.
      - name: Confirm both wheels are platform-tagged
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          test -f "dist/pyopengl_glut_binaries-$EXPECTED-py3-none-win32.whl"
          test -f "dist/pyopengl_glut_binaries-$EXPECTED-py3-none-win_amd64.whl"
          ! ls dist/*-any.whl 2>/dev/null

      - name: Check the metadata renders on PyPI
        run: python -m twine check --strict dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./dist/*.whl

  sdist:
    name: sdist
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
      - name: Check the metadata renders on PyPI
        run: python -m twine check --strict dist/*
      # The version the check job read and the version actually built have to
      # be the same thing, or the skip-if-published test was about a different
      # release than the one about to be uploaded.
      - name: Confirm the sdist carries the version that was checked
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: test -f "dist/pyopengl_glut_binaries-$EXPECTED.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [tests, version, wheels, sdist]
    # The `needs:` gate already requires all four; stating the results as well
    # keeps the guarantee if someone later edits this workflow -- adding
    # `always()` to one job would otherwise let a red or partial build reach
    # PyPI, and a release that shipped only the sdist because a wheel failed
    # cannot be taken back.
    if: >-
      needs.tests.result == 'success' &&
      needs.version.outputs.publish == 'true' &&
      needs.wheels.result == 'success' &&
      needs.sdist.result == 'success'
    runs-on: ubuntu-latest

    # Trusted publishing (OIDC): on PyPI, add a publisher for this repository
    # with workflow `release.yml` and the environment field left **blank**. The
    # OIDC claim carries no environment, so a publisher that names one will not
    # match and the upload is rejected. No API token is stored anywhere.
    permissions:
      id-token: write

    steps:
      - name: Collect wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A second net under the version check: a re-run of an
          # already-published commit is a no-op rather than a failure.
          skip-existing: true
